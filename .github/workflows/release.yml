name: Release
on:
  push:
    tags:
      - "v26.*"
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - run: pnpm install --frozen-lockfile
      - run: pnpm tsc
      - run: pnpm build
      - name: find previous release
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${GITHUB_SHA}^")
          echo "PREVIOUS_TAG=$PREVIOUS_TAG" >> "$GITHUB_ENV"
      - name: create release branch and bump version
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          BRANCH=release/${{ env.VERSION }}
          git config --local user.email 'ci@reviactyl.dev'
          git config --local user.name 'Reviactyl CI'
          git checkout -b "$BRANCH"
          git push -u origin "$BRANCH"
          sed -i "s/'canary'/'${VERSION:1}'/" config/app.php
          sed -i "s/"26\.0\.0-dev"/"${VERSION:1}"/g" package.json composer.json
          git add config/app.php
          git add package.json
          git add composer.json
          git commit -m 'ci(release): bump version'
          git push
      - name: create release archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          rm -rf node_modules tests CONTRIBUTING.md phpunit.xml
          tar -czf panel.tar.gz * .editorconfig .env.example .gitignore .prettierrc.json

          CURRENT_RELEASE="$RUNNER_TEMP/current-release"
          PREVIOUS_RELEASE="$RUNNER_TEMP/previous-release"
          UPDATE_PACKAGE="$RUNNER_TEMP/update-package"
          PREVIOUS_ARCHIVE="$RUNNER_TEMP/previous-archive"
          DELETED_PATHS="$RUNNER_TEMP/deleted-paths"
          mkdir -p "$CURRENT_RELEASE" "$PREVIOUS_RELEASE" "$UPDATE_PACKAGE" "$PREVIOUS_ARCHIVE"
          tar -xzf panel.tar.gz -C "$CURRENT_RELEASE"
          gh release download "$PREVIOUS_TAG" --pattern panel.tar.gz --dir "$PREVIOUS_ARCHIVE"
          tar -xzf "$PREVIOUS_ARCHIVE/panel.tar.gz" -C "$PREVIOUS_RELEASE"

          : > "$DELETED_PATHS"
          while IFS= read -r -d '' file; do
            relative=${file#"$PREVIOUS_RELEASE/"}
            if [ ! -f "$CURRENT_RELEASE/$relative" ]; then
              printf '%s\0' "$relative" >> "$DELETED_PATHS"
            fi
          done < <(find "$PREVIOUS_RELEASE" -type f -print0)

          while IFS= read -r -d '' file; do
            relative=${file#"$CURRENT_RELEASE/"}
            if [ ! -f "$PREVIOUS_RELEASE/$relative" ] || ! cmp -s "$file" "$PREVIOUS_RELEASE/$relative"; then
              mkdir -p "$UPDATE_PACKAGE/$(dirname "$relative")"
              cp -p "$file" "$UPDATE_PACKAGE/$relative"
            fi
          done < <(find "$CURRENT_RELEASE" -type f -print0)

          FROM_VERSION=${PREVIOUS_TAG#v}
          TO_VERSION=${VERSION#v}
          FROM_VERSION="$FROM_VERSION" TO_VERSION="$TO_VERSION" DELETED_PATHS="$DELETED_PATHS" UPDATE_PACKAGE="$UPDATE_PACKAGE" node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const deleted = fs.readFileSync(process.env.DELETED_PATHS).toString().split('\0').filter(Boolean).sort();
          const manifest = {
            from: process.env.FROM_VERSION,
            to: process.env.TO_VERSION,
            deleted,
          };
          fs.writeFileSync(path.join(process.env.UPDATE_PACKAGE, 'manifest.json'), `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

          (cd "$UPDATE_PACKAGE" && zip -q -r "$GITHUB_WORKSPACE/update.zip" .)
          sha256sum update.zip > update.zip.sha256
      - uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          files: |
            panel.tar.gz
            update.zip
            update.zip.sha256
